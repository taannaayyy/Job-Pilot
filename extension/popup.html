<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Job Pilot</title>
    <link rel="stylesheet" href="ui.css" />
    <style>
      body { width: 300px; padding: 14px; display: flex; flex-direction: column; gap: 12px; }
    </style>
  </head>
  <body>
    <h1><img src="icons/icon32.png" alt="" /> Job Pilot</h1>
    <div class="status"><span class="dot" id="dot"></span><p id="state">Checking…</p></div>
    <p class="muted" id="queue" hidden></p>
    <p class="muted">Open a job on LinkedIn and click <strong>Save to Job Pilot</strong> at the bottom right.</p>
    <div class="row">
      <button id="settings">Settings</button>
      <span class="spacer"></span>
      <button class="primary" id="sync" hidden>Sync now</button>
    </div>
    <script type="module" src="popup.js"></script>
  </body>
</html>
