[project]
name = "jobpilot"
version = "0.1.0"
description = "Local job application tracker"
authors = [
    { name = "Tanay Alpkonur", email = "107621923+taannaayyy@users.noreply.github.com" }
]
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.20.1",
    "anthropic>=2.3.0",
    "fastapi>=0.162.0",
    "pywebview>=6.2.1",
    "sqlalchemy>=2.1.6",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
jobpilot = "jobpilot:main"
jobpilot-desktop = "jobpilot.desktop:main"

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pyinstaller>=6.22.3",
    "pytest>=9.2.0",
]
