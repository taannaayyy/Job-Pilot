<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Job Pilot</title>
    <script>
      // Apply the saved theme (night by default) before first paint so the page never flashes the wrong colors.
      try {
        const t = localStorage.getItem("jobpilot.ui.theme");
        if (t === "light") document.documentElement.dataset.theme = "light";
        else if (t !== "system") document.documentElement.dataset.theme = "dark";
      } catch {
        document.documentElement.dataset.theme = "dark";
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
